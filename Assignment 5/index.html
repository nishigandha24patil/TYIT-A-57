<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMPLOYEE REGISTRATION FORM</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <form id="regForm">
            <h1>EMPLOYEE REGISTRATION FORM</h1>
            <label for="emp">Employee ID</label>
            <input type="number" id="emp">
            
            <span class="error" id="empErr"></span><br>
            <label for="first">First Name</label>
            <input type="text" id="first">
            <span class="error" id="firstErr"></span><br>

            <label for="last">Last Name</label>
            <input type="text" id="last">
            <span class="error" id="lastErr"></span><br>

            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <span class="error" id="genderErr"></span><br>

            <label for="email">Email</label>
            <input type="email" id="email">
            <span class="error" id="emailErr"></span><br>

            <label for="password">Password</label>
            <input type="password" id="password">
            <span class="error" id="passwordErr"></span><br>

            <label for="phone">Phone Number</label>
            <input type="number" id="phone">
            <span class="error" id="phoneErr"></span><br>
            
            <label for="designation">Select Designation:</label>
            <select name="designation" id="designation">
                <option value="" disabled selected>-- Select a Designation --</option>
                <option value="manager">Manager</option>
                <option value="team_lead">Team Lead</option>
                <option value="executive">Executive</option>
                <option value="associate">Associate</option>
                <option value="assistant">Assistant</option>
                <option value="intern">Intern</option>
            </select>
            <span class="error" id="designationErr"></span><br>
            <input type="submit" value="Submit">
            <input type="button" value="Reset" id="resetBtn">
        </form>
    </div>
    <script src="script.js"></script>
</body>

</html>
